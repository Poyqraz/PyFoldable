[global]
# fold_cycle_ui._reset sets a widget value through Session State; Streamlit 1.40 would show an English warning in the page
disableWidgetStateDuplicationWarning = true

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#111C2E"
textColor = "#E5EEF8"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 5
