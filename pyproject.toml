[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfoldable"
version = "0.3.0"
description = "Tip-hinged foldable propeller analysis for UAV electric propulsion ."
readme = "README.md"
authors = [{ name = "Poyraz Baydemir" }]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "CLA.md"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
neuralfoil = ["neuralfoil>=0.3.3,<0.4"]
plot = ["matplotlib>=3.4"]
ui = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfoldable*", "pythrust*"]

[tool.setuptools.package-data]
pyfoldable = ["data/airfoils/*.dat", "data/airfoils/catalog.json"]
