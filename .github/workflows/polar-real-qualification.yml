name: Polar real-backend qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XFOIL_SOURCE_URL: https://web.mit.edu/drela/Public/web/xfoil/xfoil6.99.tgz
  XFOIL_SOURCE_SHA256: 5c0250643f52ce0e75d7338ae2504ce7907f2d49a30f921826717b8ac12ebe40
  XFOIL_FORTRAN_FLAGS: -O2 -fdefault-real-8 -fallow-argument-mismatch

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install XFOIL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libx11-dev

      - name: Build pinned XFOIL source without FPE traps
        run: |
          archive="$RUNNER_TEMP/xfoil6.99.tgz"
          source_root="$RUNNER_TEMP/xfoil-source"
          install_root="$RUNNER_TEMP/xfoil-install"
          curl --fail --location --output "$archive" "$XFOIL_SOURCE_URL"
          echo "$XFOIL_SOURCE_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$source_root" "$install_root"
          tar --no-same-owner -xzf "$archive" -C "$source_root"
          make -C "$source_root/Xfoil/plotlib" gfortranDP \
            FFLAGS="$XFOIL_FORTRAN_FLAGS"
          make -C "$source_root/Xfoil/bin" -f Makefile_gfortran \
            BINDIR="$install_root/" \
            FFLAGS="$XFOIL_FORTRAN_FLAGS" \
            FFLOPT="$XFOIL_FORTRAN_FLAGS" \
            xfoil
          xfoil_bin="$install_root/xfoil"
          printf 'QUIT\n' | "$xfoil_bin" 2>&1 | grep -F "XFOIL Version 6.99"
          compiler_version="$(gfortran -dumpfullversion -dumpversion)"
          echo "XFOIL_BIN=$xfoil_bin" >> "$GITHUB_ENV"
          echo "OSMAP=$source_root/Xfoil/orrs/osmapDP.dat" >> "$GITHUB_ENV"
          echo "XFOIL_BUILD_ID=mit-xfoil6.99.tgz;sha256=$XFOIL_SOURCE_SHA256;gfortran=$compiler_version;flags=-O2,-fdefault-real-8,-fallow-argument-mismatch" >> "$GITHUB_ENV"

      - name: Install project and pinned NeuralFoil backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install "NeuralFoil==0.3.3"
          python -c "import importlib.metadata as m; assert m.version('NeuralFoil') == '0.3.3'"

      - name: Capture unreviewed qualification evidence
        run: |
          set +e
          python examples/capture_real_polar_qualification.py \
            --source-revision "$GITHUB_SHA" \
            --xfoil "$XFOIL_BIN" \
            --xfoil-build-id "$XFOIL_BUILD_ID" \
            --output-dir outputs/polar-real-qualification
          status=$?
          python -m json.tool outputs/polar-real-qualification/manifest.json >/dev/null
          exit "$status"

      - name: Upload review candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polar-real-qualification-${{ github.sha }}
          path: outputs/polar-real-qualification/
          if-no-files-found: error
          retention-days: 30
